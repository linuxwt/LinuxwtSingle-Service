services:
  litellm:
    # 稳定版镜像；要固定版本时改成 ghcr.io/berriai/litellm:v1.x.x
    #image: ghcr.io/berriai/litellm:main-stable
    image: litellm/litellm:latest
    container_name: litellm
    restart: unless-stopped

    ports:
      - "4000:4000"

    # 所有密钥走 .env，不写进镜像和 compose
    env_file:
      - .env

    environment:
      TZ: Asia/Shanghai
      LITELLM_LOG: INFO
      STORE_MODEL_IN_DB: "false"      # 单机无 DB，模型只从 config.yaml 读

    volumes:
      # 改完 config.yaml 只需 restart，不用重建镜像
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs

    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
      - "--num_workers=4"
      - "--max_requests_before_restart=2000"

    # 万一网关跑在 docker 宿主机上，可用 host.docker.internal 代替网关内网 IP
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\" || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - llm-net

networks:
  llm-net:
    driver: bridge

